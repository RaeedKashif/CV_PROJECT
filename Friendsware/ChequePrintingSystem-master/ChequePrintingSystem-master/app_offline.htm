<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cheque Printing System</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .message {
            max-width: 560px;
            margin: 24px;
            padding: 32px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 16px 48px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #0f4c81;
            font-size: 2rem;
        }

        p {
            margin-bottom: 0;
            line-height: 1.6;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Cheque Printing System</h1>
        <p>The application is temporarily offline for publishing or maintenance. Please try again in a few minutes.</p>
    </div>
</body>
</html>
